[package]
name = "livecrate"
version = "0.1.0"
description = "PULSE — AI-powered DJ Studio"
authors = ["PULSE Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pulse_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio decoding (symphonia)
symphonia = { version = "0.5", features = [
    "aac",
    "mp3",
    "ogg",
    "vorbis",
    "isomp4",
    "mkv",
] }

# Sample rate conversion
rubato = "0.16"
ndarray = "0.16"

# Thread-safe state management
parking_lot = "0.12"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"
stem-splitter-core = { version = "1.2.0", default-features = false, features = ["directml", "onednn", "xnnpack"] }
ort = { version = "2.0.0-rc.11", default-features = false, features = ["directml", "download-binaries"] }
rand = "0.9.4"
directories = "6.0.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package."*"]
opt-level = 3
