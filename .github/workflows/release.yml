name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
          - platform: macos-latest
            os: macos
          - platform: ubuntu-22.04
            os: linux

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm install

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf


      - name: Download yt-dlp sidecar (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          mkdir -Force src-tauri/binaries
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe"

      - name: Download yt-dlp sidecar (macOS)
        if: matrix.os == 'macos'
        run: |
          mkdir -p src-tauri/binaries
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o "src-tauri/binaries/yt-dlp-x86_64-apple-darwin"
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o "src-tauri/binaries/yt-dlp-aarch64-apple-darwin"
          chmod +x src-tauri/binaries/yt-dlp-*

      - name: Download yt-dlp sidecar (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p src-tauri/binaries
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" -o "src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu"
          chmod +x src-tauri/binaries/yt-dlp-*

      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LiveCrate v__VERSION__'
          releaseBody: 'Nouveau build de LiveCrate ! (Windows: .msi | Mac: .dmg | Linux: .AppImage, .deb)'
          releaseDraft: false
          prerelease: false
